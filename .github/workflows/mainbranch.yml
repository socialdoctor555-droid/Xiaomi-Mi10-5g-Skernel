name: APT-n0kernel(staging-umi)

on:
  workflow_dispatch:
    inputs:
      rekernel_selector:
        description: 'Enable Rekernel integration'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - rekernel
jobs:
  build:
    name: Build Kernel for Xiaomi Mi10 UMI
    runs-on: ubuntu-latest
    env:
      REKERNEL_SELECTOR: ${{ github.event.inputs.rekernel_selector }}

      # AnyKernel3 (flashable zip packer)
      ANYKERNEL_REPO: https://github.com/AstideLabs/AnyKernel3
      ANYKERNEL_BRANCH: master
      ANYKERNEL_DIR: anykernel

      # Droidspaces non-GKI kernel patches
      DROIDSPACES_PATCH_DIR: /tmp/droidspaces-patches
      DROIDSPACES_PATCH_URL: "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/02.fix_restore%20cgroup%20file%20prefix%20handling%20.patch"

      # ReSukiSU (KernelSU) setup
      KSU_SETUP_URI: https://github.com/ReSukiSU/ReSukiSU/raw/refs/heads/main/kernel/setup.sh
      KSU_SETUP_BRANCH: main

      # SUSFS4KSU source
      SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
      SUSFS_BRANCH: kernel-4.19
      SUSFS_DIR: /tmp/susfs4ksu

      # Rekernel patches
      REKERNEL_PATCH: https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd/raw/refs/heads/mainline/Patches/Rekernel/rekernel_patches.sh
      REKERNEL_EXTRA: https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd/raw/refs/heads/mainline/Patches/Rekernel/rekernel_extra.patch
    steps:
    - name: Checkout Source
      uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Cleanup Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3

    - name: Setup Cache (ccache)
      uses: actions/cache@v5
      with:
        path: ~/.cache/ccache_mikernel
        key: kernel-ccache-umi-build-miui.sh-${{ github.run_id }}
        restore-keys: |
          kernel-ccache-umi-build-miui.sh-
          kernel-ccache-umi-
          kernel-ccache-

    - name: Setup Toolchain (Neutron Clang 18)
      run: |
         mkdir -p $HOME/zyc-clang
         cd $HOME/zyc-clang
         wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/05012024/neutron-clang-05012024.tar.zst
         tar --zstd -xvf neutron-clang-05012024.tar.zst
         
    # =====================================================================
    # Downloads -- all external fetches for the kernel build live here,
    # each as its own step, so they're easy to find/retry in the Actions log.
    # =====================================================================

    - name: "Download :: AnyKernel3 (flashable zip packer)"
      run: |
        rm -rf "$ANYKERNEL_DIR"
        git clone "$ANYKERNEL_REPO" -b "$ANYKERNEL_BRANCH" --single-branch --depth=1 "$ANYKERNEL_DIR"

    - name: "Download :: Droidspaces Non-GKI Patches"
      run: |
        mkdir -p "$DROIDSPACES_PATCH_DIR"
        curl -fsSL -o "$DROIDSPACES_PATCH_DIR/02.fix_restore_cgroup_file_prefix_handling.patch" \
          "$DROIDSPACES_PATCH_URL"

    - name: "Download :: ReSukiSU (KernelSU) Setup"
      run: |
        curl -LSs --fail --retry 3 "$KSU_SETUP_URI" | bash -s "$KSU_SETUP_BRANCH"

    - name: "Download :: SUSFS4KSU Source"
      run: |
        rm -rf "$SUSFS_DIR"
        git clone -b "$SUSFS_BRANCH" --single-branch --depth=1 "$SUSFS_REPO" "$SUSFS_DIR"

    - name: "Download :: Rekernel Patches"
      if: ${{ github.event.inputs.rekernel_selector == 'rekernel' }}
      run: |
        wget -qO- "$REKERNEL_PATCH" | bash
        wget -qO- "$REKERNEL_EXTRA" | patch -s -p1 --fuzz=5

    # =====================================================================
    # Build
    # =====================================================================

    - name: Build Kernel
      run: |
        chmod +x build-miui.sh
        echo "Using build-miui.sh....."
        echo "REKERNEL_SELECTOR: [$REKERNEL_SELECTOR]"
        bash build-miui.sh

    - name: Upload Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: Skernelv1
        path: ./*.zip
        if-no-files-found: error
